function contextoVampiro(v, editando) {
  const s = structuredClone(v);

    columnas: s.lesiones.map((col, i) => ({ rango: ["1-2", "3-4", "5-6"][i], casillas: col.map((l, j) => ({ ...l, ruta: `lesiones.${i}.${j}` })) })),

}

{ const d = ventana("Iryna · preparar la tirada", "er-dialogo er-tirada-dlg", `<div class="er-dt"><h2 class="er-nombre-cinta">¿Qué haces?</h2><p class="er-avisos-linea"><span>No puedes usar los +</span></p>
<div class="er-dt-atrs">${Object.entries(ATRIBUTOS).map(([k, n], i) => `<label class="er-chip er-dt-atr"><input type="radio" name="atributo" ${i === 4 ? "checked" : ""}><span>${n}</span><b>${VAMPIROS[0].atributos[k]}</b></label>`).join("")}<label class="er-chip er-dt-atr libre"><input type="radio" name="atributo"><span>Otra cosa</span><b>2</b></label></div>

<div class="er-dt-bloque"><span class="er-cinta">Equipo</span> <small class="er-susurro">+1 dado, gasta un uso</small>
<label class="er-dt-op"><input type="checkbox" checked><span><b>Rifle de caza exquisito</b><small>5/5 usos · +posición elevada</small></span></label>
<label class="er-dt-op"><input type="checkbox"><span><b>Sable de caballería encantado</b><small>5/5 usos · +a la carga</small></span></label>
<label class="er-dt-op"><input type="checkbox" disabled><span><b>Runas explosivas</b><small>0/3 usos</small></span></label></div>
<div class="er-dt-bloque"><span class="er-cinta">Habilidades</span> <small class="er-susurro">+1 dado · tienes 4 de Sangre</small>
<label class="er-dt-op"><input type="checkbox"><span><b>Glamur oscuro</b><small>1 de Sangre · +rodeada de belleza</small></span></label></div>
<div class="er-dt-bloque er-dt-extra"><span class="er-cinta">Dados extra</span> <input type="number" value="0"></div></div>

/* Tarjetas de chat */
const chat = document.createElement("div"); chat.className = "chat"; document.body.append(chat);
const base = { actor: "iryna", ultimo: false, atributo: "Disparo", umbral: 4, usados: ["Rifle de caza exquisito", "Runas explosivas"], bonos: [{ nombre: "Rifle de caza exquisito", n: 1, req: "posición elevada", hecho: false }, { nombre: "Runas explosivas", n: 2, req: "oculto", hecho: false }],

  { ...base, actor: "nicole", ultimo: true, atributo: "Último gesto: Preparada para explotar", dados: dados([6, 6, 5, 4, 4, 3, 2, 1]), usados: [], bonos: [], gm: { caras: [], exitos: 0, nombre: "", otras: 0 } }
];
for (const t of tarjetas) { const d = document.createElement("div"); d.innerHTML = htmlTirada({ id: "m" }, t); chat.append(d); }
const menu = document.createElement("div"); menu.className = "mr-eat-the-reich er-menu";
menu.innerHTML = `<p>Gastar este crítico (2 éxitos) en…</p><button><i class="fa-solid fa-bullseye"></i> Objetivo: Cruzar el museo (5, Desafío 1)</button><button><i class="fa-solid fa-skull"></i> Atacar: Einherjar (4)</button><button><i class="fa-solid fa-shield"></i> Defenderse (quedan 2 ataques)</button><button><i class="fa-solid fa-star"></i> ESPECIAL · Tiro certero</button>`;
chat.append(menu);
// Tablón del mapa: ?tablon pinta el mapa de París con las dos notas rellenas por el código real (escenas.mjs).
if (new URLSearchParams(location.search).has("tablon")) {

  const esc = 0.36, hud = document.createElement("div"); hud.id = "hud";

  document.body.style.display = "block"; document.body.append(hud);
  // Notas del Sector 3 en su sitio (misma cuenta que scripts/gen-aventura.mjs) para las dianas: ?tablon&diana=hotel[&jugador]
  const PT = 4000 / 1114, notas = LOCALIZACIONES.filter(l => l.sector === 3).map(l => ({ x: Math.round((l.mapa[1] + (l.mapa[0] === 49 ? 557 : 0)) * PT), y: Math.round((l.mapa[2] - 1) * PT), getFlag: () => l.clave }));

  game.user.isGM = !new URLSearchParams(location.search).has("jugador");

  game.actors.filter = f => vs.filter(f);
  game.users = { filter: f => ["Marta", "Íñigo", "Laura", "Pau", "Edu"].map((name, i) => ({ name, i, isGM: false })).filter(f) };
  game.world = { title: "Beberse a Hitler" };
  game.settings.get = (_, k) => (k === "mision" ? (new URLSearchParams(location.search).has("diana") ? { escena: "", ronda: 1, visitadas: [], caidos: [], banquillo: ["flint", "astrid"], diana: new URLSearchParams(location.search).get("diana") } : { escena: "Museo de la Guerra Europea", ronda: 2, visitadas: ["sirena", "catedral", "museo"], caidos: ["Stahlsoldat"], desplegado: "sirena", resueltas: ["sirena", "catedral"], banquillo: ["flint"] }) : k === "campana" ? "" : {});
  (await import("../module/escenas.mjs")).pintarTablon();

}

  const escena = { background: { src: limpio }, _source: { background: { src: limpio } }, getFlag: () => clave, async update(c) { this.background.src = c["background.src"]; board.style.backgroundImage = `url(${this.background.src})`; } };
